<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ferkomotors Co.</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">

  <style>
    :root {
      --yellow: #FDB927;
      --purple: #4b1d78;
      --black: #0B0B0B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      color: #fff;
      background: url('uvod.png') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Barevný přeliv */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 30%, rgba(75,29,120,0.45), transparent 60%),
                  radial-gradient(circle at 80% 20%, rgba(253,185,39,0.4), transparent 70%),
                  radial-gradient(circle at 50% 80%, rgba(11,11,11,0.6), transparent 80%);
      background-size: 200% 200%;
      mix-blend-mode: overlay;
      animation: crazyGradient 25s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes crazyGradient {
      0% { background-position: 0% 0%, 100% 0%, 50% 100%; }
      25% { background-position: 100% 100%, 0% 50%, 80% 0%; }
      50% { background-position: 50% 50%, 80% 80%, 0% 20%; }
      75% { background-position: 0% 100%, 50% 0%, 100% 50%; }
      100% { background-position: 100% 0%, 0% 100%, 50% 50%; }
    }

    /* Navigace */
    header {
      position: absolute;
      top: 70px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      z-index: 20;
    }

    nav {
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
      background: rgba(0,0,0,0.45);
      padding: 10px 25px;
      border-radius: 12px;
      backdrop-filter: blur(6px);
      transition: all 0.3s ease;
    }

    nav a {
      font-family: 'Russo One', sans-serif;
      text-transform: uppercase;
      font-size: 18px;
      color: #fff;
      padding: 10px 18px;
      border-radius: 0;
      transition: .3s;
      letter-spacing: 1px;
      text-decoration: none;
    }

    nav a:hover {
      background: rgba(255,255,255,0.2);
    }

    nav a.active {
      background: var(--yellow);
      color: var(--black);
    }

    /* Hlavní sekce */
    main {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 0 20px;
    }

    /* LOGO */
    .text-box {
      position: relative;
      background: none;
      border: none;
      box-shadow: none;
      width: auto;
      height: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Tmavší ztmavení pod logem */
    .text-box::before {
      content: "";
      position: absolute;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 90%);
      z-index: -1;
      filter: blur(70px);
    }

    .text-box img {
      width: 600px;
      height: auto;
      object-fit: contain;
      display: block;
      animation: fadeUp 1.5s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* TLAČÍTKO - sjednoceno se stylem menu */
    a.btn {
      background: var(--yellow);
      color: var(--black);
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 0; /* odstraněné zakulacení */
      font-family: 'Russo One', sans-serif;
      text-transform: uppercase;
      font-size: 18px;
      letter-spacing: 1px;
      transition: 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      margin-top: 50px;
      animation: fadeUp 1s ease forwards;
      animation-delay: 0.8s;
      position: relative;
      overflow: hidden;
    }

    a.btn:hover {
      background: #fff;
      color: var(--purple);
      transform: scale(1.05);
    }

    footer {
      background: rgba(0,0,0,0.7);
      color: #ccc;
      text-align: center;
      padding: 15px;
      font-size: 14px;
      position: absolute;
      bottom: 0;
      width: 100%;
      z-index: 10;
    }

    /* Mobilní menu toggle */
    .menu-toggle {
      display: none;
    }

    .menu-btn {
      display: none;
      position: absolute;
      top: 30px;
      right: 30px;
      font-size: 28px;
      color: #fff;
      cursor: pointer;
      z-index: 30;
    }

    /* RESPONSIVITA */
    @media (max-width: 768px) {
      .menu-btn {
        display: block;
      }

      nav {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 15px;
        background: rgba(0,0,0,0.85);
        border-radius: 10px;
        position: absolute;
        top: 80px;
        right: 20px;
      }

      .menu-toggle:checked ~ header nav {
        display: flex;
      }

      nav a {
        font-size: 16px;
        padding: 10px 20px;
      }

      .text-box img {
        width: 250px;
      }

      .text-box::before {
        width: 250px;
        height: 250px;
        filter: blur(30px);
      }

      a.btn {
        font-size: 14px;
        padding: 10px 20px;
        margin-top: 30px;
      }

      footer {
        font-size: 12px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Checkbox toggle pro mobilní menu -->
  <input type="checkbox" id="menu-toggle" class="menu-toggle">
  <label for="menu-toggle" class="menu-btn"><i class="fa-solid fa-bars"></i></label>

  <header>
    <nav>
      <a class="active" href="index.html">Úvod</a>
      <a href="sluzby.html">Služby</a>
      <a href="cenik.html">Ceník</a>
      <a href="novinky.html">Novinky</a>
      <a href="blog.html">Blog</a>
      <a href="kontakt.html">Kontakt</a>
      <a href="objednat.html">Objednat se</a>
    </nav>
  </header>

  <main>
    <div class="text-box">
      <img src="logo.png" alt="Ferkomotors Co. logo">
    </div>
    <a href="objednat.html" class="btn">Objednat se</a>
  </main>
</body>
</html>
