<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontakt | Ferkomotors Co.</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">

  <style>
    :root {
      --yellow: #FDB927;
      --purple: #4b1d78;
      --black: #0B0B0B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      color: #111;
      background: url('obrazek1.png') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      overflow-x: hidden;
      text-align: center;
    }

    /* ===== MENU ===== */
    header {
      position: fixed;
      top: 40px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      z-index: 30;
    }

    nav {
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
      background: rgba(0,0,0,0.45);
      padding: 10px 25px;
      border-radius: 12px;
      backdrop-filter: blur(6px);
      transition: all 0.3s ease;
    }

    nav a {
      font-family: 'Russo One', sans-serif;
      text-transform: uppercase;
      font-size: 18px;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      transition: .3s;
      text-decoration: none;
      letter-spacing: 1px;
    }

    nav a:hover {
      background: rgba(255,255,255,0.2);
    }

    nav a.active {
      background: var(--yellow);
      color: var(--black);
    }

    /* ===== HAMBURGER ===== */
    .menu-toggle {
      display: none;
    }

    .menu-btn {
      display: none;
      position: fixed;
      top: 30px;
      right: 30px;
      font-size: 28px;
      color: var(--yellow);
      background: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      z-index: 40;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    .menu-btn:hover {
      background: var(--yellow);
      color: var(--black);
      transform: scale(1.05);
    }

    /* ===== OBSAH ===== */
    main {
      position: relative;
      z-index: 5;
      max-width: 1100px;
      margin: 160px auto 100px;
      padding: 0 20px;
    }

    h1 {
      font-family: 'Russo One', sans-serif;
      font-size: 42px;
      color: var(--purple);
      background: #fff;
      display: inline-block;
      padding: 14px 40px;
      border-radius: 12px;
      border: 3px solid var(--purple);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      margin-bottom: 40px;
    }

    p.subtext {
      color: #444;
      font-size: 18px;
      background: #fff;
      display: inline-block;
      padding: 10px 25px;
      border-radius: 10px;
      margin-bottom: 50px;
      border: 2px solid var(--purple);
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
      justify-content: center;
      margin-bottom: 50px;
    }

    .contact-box {
      background: #fff;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.15);
      border: 2px solid rgba(0,0,0,0.05);
      transition: 0.3s;
    }

    .contact-box:hover {
      transform: translateY(-4px);
      border-color: var(--yellow);
    }

    .contact-box h3 {
      color: var(--purple);
      margin-bottom: 12px;
      font-size: 22px;
      font-family: 'Russo One', sans-serif;
    }

    .contact-box p {
      color: #555;
      line-height: 1.6;
      font-size: 15px;
    }

    .map {
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      margin-bottom: 60px;
    }

    iframe {
      width: 100%;
      height: 400px;
      border: none;
    }

    form {
      background: #fff;
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.15);
      border: 2px solid rgba(0,0,0,0.05);
      max-width: 600px;
      margin: auto;
    }

    form h3 {
      color: var(--purple);
      font-family: 'Russo One', sans-serif;
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 14px 18px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      margin-bottom: 15px;
    }

    input:focus, textarea:focus {
      border-color: var(--purple);
      outline: none;
      box-shadow: 0 0 8px rgba(75,29,120,0.2);
    }

    button {
      background: var(--purple);
      color: #fff;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }

    button:hover {
      background: var(--yellow);
      color: var(--black);
    }

    footer {
      background: rgba(0,0,0,0.85);
      color: #ccc;
      text-align: center;
      padding: 20px;
      font-size: 13px;
      width: 100%;
      margin-top: 60px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1024px) {
      h1 {
        font-size: 32px;
        padding: 12px 20px;
      }

      .menu-btn { display: block; }

      nav {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 15px;
        background: rgba(0,0,0,0.9);
        border-radius: 10px;
        position: fixed;
        top: 80px;
        right: 20px;
        opacity: 0;
        transform: translateY(-20px);
        transition: all 0.4s ease;
      }

      .menu-toggle:checked ~ header nav {
        display: flex;
        opacity: 1;
        transform: translateY(0);
      }

      nav a {
        font-size: 16px;
        padding: 10px 20px;
      }

      iframe { height: 300px; }
    }
  </style>
</head>
<body>

  <!-- HAMBURGER -->
  <input type="checkbox" id="menu-toggle" class="menu-toggle">
  <label for="menu-toggle" class="menu-btn"><i class="fa-solid fa-bars"></i></label>

  <!-- MENU -->
  <header>
    <nav>
      <a href="index.html">Úvod</a>
      <a href="sluzby.html">Služby</a>
      <a href="cenik.html">Ceník</a>
      <a href="novinky.html">Novinky</a>
      <a href="blog.html">Blog</a>
      <a href="kontakt.html" class="active">Kontakt</a>
      <a href="objednat.html">Objednat se</a>
    </nav>
  </header>

  <!-- OBSAH -->
  <main>
    <h1>Kontakt</h1>

    <div class="contact-grid">
      <div class="contact-box">
        <h3><i class="fa-solid fa-map-location-dot"></i> Adresa</h3>
        <p>Pivovarská 493/493<br>Vítkov, Česká republika</p>
      </div>
      <div class="contact-box">
        <h3><i class="fa-solid fa-phone"></i> Telefon</h3>
        <p>+420 601 366 941</p>
        <h3><i class="fa-regular fa-envelope"></i> E-mail</h3>
        <p>ferkomotorsco@seznam.cz</p>
      </div>
      <div class="contact-box">
        <h3><i class="fa-regular fa-clock"></i> Otevírací doba</h3>
        <p>Pondělí – Pátek: 8:00 – 16:00<br>Sobota: dle domluvy<br>Neděle: zavřeno</p>
      </div>
    </div>

    <div class="map">
      <iframe src="https://www.google.com/maps?q=Pivovarská+493,+Vítkov,+Česko&output=embed" allowfullscreen loading="lazy"></iframe>
    </div>

    <form>
      <h3>Napište nám</h3>
      <input type="text" placeholder="Jméno a příjmení" required>
      <input type="email" placeholder="E-mail" required>
      <textarea rows="5" placeholder="Vaše zpráva..." required></textarea>
      <button type="submit">Odeslat zprávu</button>
    </form>
  </main>

</body>
</html>
